name: Bug 报告
description: 报告可复现的运行问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: chip
    attributes:
      label: Mac 芯片
      options:
        - Apple Silicon
        - Intel
        - 不确定
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本
      placeholder: 例如 15.5
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请勿上传私人照片、聊天记录或账号信息。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
