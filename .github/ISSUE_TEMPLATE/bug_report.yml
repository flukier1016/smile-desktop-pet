name: Bug report
description: 报告可复现的功能或界面问题
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        请先隐藏账号、窗口标题、聊天内容和其他私人信息。安全问题请使用私密漏洞上报。
  - type: input
    id: version
    attributes:
      label: 笑笑桌宠版本
      placeholder: 例如 1.3.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS 与芯片
      placeholder: 例如 macOS 15.5 / Apple Silicon
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最短、稳定的步骤。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除截图、录屏和日志中的私人信息与凭据。
          required: true
