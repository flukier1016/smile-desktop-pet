name: Feature request
description: 建议新的玩法、场景或体验改进
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 先描述使用场景和痛点。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: dropdown
    id: permission
    attributes:
      label: 是否需要新权限或联网
      options:
        - 不需要
        - 可能需要
        - 不确定
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 可选。说明你试过或考虑过的替代方式。
