name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos-universal:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Security and privacy gate
        run: ./scripts/security-check.sh
      - name: Test scenes, awareness lifecycle, rendering, and companion progress
        run: ./scripts/test.sh
      - name: Build universal app
        run: ./build.sh
      - name: Verify bundle
        run: |
          plutil -lint "笑笑桌宠.app/Contents/Info.plist"
          codesign --verify --deep --strict "笑笑桌宠.app"
          test "$(lipo -archs "笑笑桌宠.app/Contents/MacOS/SmilePet")" = "x86_64 arm64" \
            || test "$(lipo -archs "笑笑桌宠.app/Contents/MacOS/SmilePet")" = "arm64 x86_64"

  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: smilepet-landing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned package manager and locked dependencies
        run: |
          npm install --global pnpm@10.33.0
          pnpm install --frozen-lockfile
      - name: Typecheck, build, and prerender
        run: pnpm build
      - name: Test HTTP delivery and compression
        run: pnpm test
